name: CI

on:
    push:
        branches: [main, develop]
        tags: ["v*"]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

permissions:
    contents: read

env:
    PUBLISH_NODE_VERSION: "24"

jobs:
    checks:
        name: Checks (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["19", "20", "21", "22", "23", "24"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Smoke-test package files
              run: npm run smoke:package

            - name: Dry-run pack
              run: npm run publish:dry-run

    smoke-package:
        name: Smoke package (Node ${{ matrix.node-version }})
        needs: [checks]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["19", "20", "21", "22", "23", "24"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Smoke-test packed artifact
              run: npm run smoke:package

    scan:
        name: SonarCloud scan
        if: |
            github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - name: Install coverage tooling
              run: npm ci --ignore-scripts

            - name: Test executable appearance contracts with coverage
              run: npm run test:coverage

            - name: Verify JavaScript coverage report
              run: |
                  test -f coverage/lcov.info
                  grep '^SF:appearance.js$' coverage/lcov.info

            - name: SonarCloud scan
              uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
              with:
                  args: -Dsonar.qualitygate.wait=true
              env:
                  SONAR_TOKEN: ${{ secrets.PACKAGES_SONAR_TOKEN }}

    publish:
        name: Publish
        needs: [checks, scan, smoke-package]
        if: |
            startsWith(github.ref, 'refs/tags/v') &&
            needs.checks.result == 'success' &&
            needs.smoke-package.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.PUBLISH_NODE_VERSION }}

            - name: Verify artifact before publish
              run: npm run smoke:package

            - name: Verify release tag matches package version
              run: |
                  node --input-type=module <<'NODE'
                  import assert from 'node:assert/strict';
                  import { readFileSync } from 'node:fs';
                  const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
                  assert.equal(process.env.GITHUB_REF, `refs/tags/v${pkg.version}`, 'Release tag must match package.json version');
                  console.log(pkg.name, pkg.version, process.env.GITHUB_REF);
                  NODE

            - name: Configure npm auth
              run: |
                echo "registry=https://registry.npmjs.org/" > ~/.npmrc
                echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
              env:
                NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish to npm
              run: npm publish --access public --ignore-scripts
              env:
                NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
